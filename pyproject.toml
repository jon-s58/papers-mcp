[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "papers-mcp"
version = "0.1.0"
description = "Local high-accuracy academic paper retrieval and MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Papers MCP Contributors" }]
dependencies = [
  "mcp>=1.28,<3",
  "numpy>=2.0",
  "pymupdf>=1.27,<2",
  "pymupdf4llm>=1.28.2,<2",
  "psutil>=7.0,<8",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
models = [
  "accelerate>=1.0,<2",
  "sentence-transformers>=5.4,<6",
  "torch>=2.7,<3",
  "transformers>=4.51,<6",
]
marker = ["marker-pdf>=2.0"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.9",
]

[project.scripts]
papers-mcp = "papers_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/papers_mcp"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: uses real PDF extraction or model backends",
  "models: downloads or loads the configured production models",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
